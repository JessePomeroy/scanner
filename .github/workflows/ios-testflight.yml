name: iOS TestFlight

# Builds, signs and uploads the iPhone app to TestFlight from a hosted Mac.
# Runs on changes to ios/ on main, or by hand for any branch:
#   gh workflow run ios-testflight.yml --ref <branch>
#
# Needs three repository secrets from App Store Connect (Users and Access,
# Integrations, App Store Connect API, Team Keys):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the full text of the .p8 file)
# It never runs for pull requests, so forks cannot reach the secrets.

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-testflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # Unique for every run and every re-run, as Apple requires.
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that the App Store Connect key is configured
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::Set the ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 repository secrets first."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/ScannerApp.xcodeproj \
            -scheme ScannerApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ScannerApp.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -quiet
      - name: Sign and upload
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ScannerApp.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build $BUILD_NUMBER. It appears in TestFlight after Apple finishes processing it." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
